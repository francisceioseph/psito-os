name: psito_apps
description: "Host dos apps do Psito: cada PsitoApp roda no próprio processo, numa janela comum do labwc."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.8.0
  psito_sdk:
    path: ../packages/psito_sdk
  psito_services:
    path: ../packages/psito_services
  psito_runtime:
    path: ../packages/psito_runtime
  system_shell:
    path: ../system_shell

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
