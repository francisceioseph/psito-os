name: psito_shell
description: "O shell do Psito: cliente layer-shell do labwc (top bar, dock, launcher, notificações)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.8.0
  psito_sdk:
    path: ../packages/psito_sdk
  psito_fs:
    path: ../packages/psito_fs
  psito_services:
    path: ../packages/psito_services
  system_shell:
    path: ../system_shell

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
