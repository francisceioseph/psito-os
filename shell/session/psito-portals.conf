# Os portais da sessão do Psito (XDG_CURRENT_DESKTOP=Psito:labwc): tudo pelo
# xdg-desktop-portal-gtk, inclusive o de configurações, que publica o
# color-scheme do gsettings. Vai no pacote psito-shell, em
# /usr/share/xdg-desktop-portal/.
[preferred]
default=gtk
org.freedesktop.impl.portal.Inhibit=none
