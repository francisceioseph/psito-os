# O socket de áudio dos apps no sandbox (ver psito-no-capture.lua). Sem o script,
# o cliente com pipewire.access=psito fica sem permissão e não toca: falha fechada.
wireplumber.components = [
  {
    name = psito-no-capture.lua, type = script/lua
    provides = hooks.psito.no-capture
  }
]
wireplumber.profiles = {
  main = {
    hooks.psito.no-capture = required
  }
}
