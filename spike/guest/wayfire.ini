# Configuração do Wayfire no spike (~/.config/wayfire.ini na VM).
# Sem o wf-shell: o waybar faz o papel do painel do Psito.

[core]
# No Wayfire vários protocolos são plugins: foreign-toplevel, xdg-activation,
# session-lock e input-method-v1 (text-input-v3) só existem se ligados aqui
plugins = autostart command decoration grid move resize place switcher scale animate wm-actions vswitch ipc ipc-rules foreign-toplevel xdg-activation session-lock input-method-v1 gtk-shell shortcuts-inhibit idle
preferred_decoration_mode = server
xwayland = true
close_top_view = <ctrl> <alt> KEY_W | <alt> KEY_F4

[output:Virtual-1]
mode = 1440x900

[input]
xkb_layout = br

[autostart]
autostart_wf_shell = false
# O shell do Psito, se compilado; senão, o waybar
panel = sh -c 'if [ -x "$HOME/shell_client/psito_shell_client" ]; then exec "$HOME/shell_client/psito_shell_client" >/tmp/spike/shell.log 2>&1; else exec waybar; fi'

[decoration]
active_color = 1.0 0.757 0.027 1.0
inactive_color = 0.071 0.094 0.106 1.0
border_size = 1
title_height = 26
font = sans

[animate]
open_animation = zoom
close_animation = fade
duration = 250

# Combinações de VM do Psito, as mesmas do labwc
[command]
binding_launcher = <ctrl> KEY_SPACE
command_launcher = gdbus call --session --dest org.psito.Shell --object-path /org/psito/Shell --method org.psito.Shell.ToggleLauncher

[switcher]
next_view = <ctrl> KEY_TAB
prev_view = <ctrl> <shift> KEY_TAB

[grid]
slot_l = <alt> <shift> KEY_LEFT
slot_r = <alt> <shift> KEY_RIGHT
slot_c = <alt> <shift> KEY_UP

[wm-actions]
minimize = <alt> <shift> KEY_DOWN

[scale]
toggle = <ctrl> <alt> KEY_S
