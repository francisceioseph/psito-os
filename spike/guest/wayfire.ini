# Configuração do Wayfire no spike (~/.config/wayfire.ini na VM).
# Sem o wf-shell: o painel é o shell do Psito (ou o waybar). Os atalhos e as
# cores das molduras vêm da ponte do shell, pelo IPC (spike/shell_client/lib/bridge).

[core]
# No Wayfire vários protocolos são plugins: foreign-toplevel, xdg-activation,
# session-lock e input-method-v1 (text-input-v3) só existem se ligados aqui.
# Sem o switcher: o Alt+Tab é o do Psito
plugins = autostart command decoration grid move resize place scale animate wm-actions vswitch ipc ipc-rules foreign-toplevel xdg-activation session-lock input-method-v1 gtk-shell shortcuts-inhibit idle
preferred_decoration_mode = server
xwayland = true

[output:Virtual-1]
mode = 1440x900

[input]
xkb_layout = br

[autostart]
autostart_wf_shell = false
# O shell do Psito como unidade do systemd do usuário (ou o waybar)
panel = psito-shell-start

[decoration]
active_color = 1.0 0.757 0.027 1.0
inactive_color = 0.071 0.094 0.106 1.0
border_size = 1
title_height = 26
font = sans

[animate]
open_animation = zoom
close_animation = fade
duration = 250

[scale]
toggle = <ctrl> <alt> KEY_S
