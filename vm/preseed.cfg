# Respostas da instalação do Debian 13 para a VM do Psito OS.
# O install-os.sh embute este arquivo (e a chave SSH) no initrd do instalador.
# @PASSWORD_HASH@ é substituído pelo hash da senha do usuário psito.

# Idioma, teclado e fuso
d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i time/zone string America/Sao_Paulo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Rede
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string psito
d-i netcfg/get_domain string local
d-i netcfg/hostname string psito

# Espelho
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Usuários: sem root, só o psito com sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Psito
d-i passwd/username string psito
d-i passwd/user-password-crypted password @PASSWORD_HASH@

# Disco inteiro, uma partição
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Pacotes: sistema base + SSH (o resto vem do provision.sh)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo rsync
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Boot
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i finish-install/reboot_in_progress note

# Chave SSH do host e sudo sem senha para os scripts
d-i preseed/late_command string \
    mkdir -p /target/home/psito/.ssh; \
    cp /authorized_keys /target/home/psito/.ssh/authorized_keys; \
    in-target chown -R psito:psito /home/psito/.ssh; \
    in-target chmod 700 /home/psito/.ssh; \
    in-target chmod 600 /home/psito/.ssh/authorized_keys; \
    echo 'psito ALL=(ALL) NOPASSWD: ALL' > /target/etc/sudoers.d/psito; \
    chmod 440 /target/etc/sudoers.d/psito
